exchange_name: "MockX-2"
instruments:
  BTC-USDT:
    tick_size: "0.01"
    lot_size: "0.001"
    price_display_precision: 2
    quantity_display_precision: 3
  ETH-USDT:
    tick_size: "0.01"
    lot_size: "0.001"
    price_display_precision: 2
    quantity_display_precision: 3
latency:
  network_ms: 100
  engine_ms: 20
execution:
  reject_prob: 0.02
  random_seed: 84
admin_api:
  host: "0.0.0.0"
  port: 8000
  enabled: true
fix:
  enabled: true
  delivery_retry_interval_ms: 1000
  delivery_max_attempts_per_cycle: 3
  delivery_terminal_retention_records: 10000
  session_participants:
    "FIX.4.4:MOCKX2->CLIENT2": "participant-2"
scheduler:
  mode: "external"
  interval_ms: 10
  max_advance_ms: 86400000
  max_events_per_advance: 100000
websocket:
  heartbeat_interval_seconds: 10
  outbound_queue_capacity: 8
  send_timeout_seconds: 5
  heartbeat_stale_seconds: 30
  market_data_stale_seconds: 30
  fallback_poll_seconds: 2
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 30
  staleness_check_seconds: 1
cors_origins: []
prometheus:
  enabled: true
tsdb:
  enabled: true
  url: "http://influxdb:8086"
  token: "mockx-token"
  org: "mockx-org"
  bucket: "mockx"
  flush_batch_size: 1000
  max_buffer_records: 10000
  max_buffer_bytes: 67108864
  flush_interval_ms: 1000
  retry_backoff_ms: 1000
  max_retry_delay_ms: 30000
  overflow_retry_attempts: 3
  shutdown_timeout_ms: 10000
  overflow_policy: "reject_new"
  timeout_ms: 10000
