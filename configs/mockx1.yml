exchange_name: "MockX-1"
symbols:
  - BTC-USDT
  - ETH-USDT
latency:
  network_ms: 0
  engine_ms: 1
  session_delays:
    liquidity_bot: 1_000      # 1 second - establishes liquidity first
    strategy_bot: 5_000       # 5 seconds - reacts to established liquidity
    taker_bot: 10_000         # 10 seconds - random traders
    noise_bot: 10_000         # 10 seconds - random traders
execution:
  reject_prob: 0.0
  random_seed: 42
admin_api:
  host: "0.0.0.0"
  port: 8000
  enabled: true
fix:
  enabled: true
  delivery_retry_interval_ms: 1000
  delivery_max_attempts_per_cycle: 3
scheduler:
  mode: "external"
  interval_ms: 10
  max_advance_ms: 86400000
  max_events_per_advance: 100000
websocket:
  heartbeat_interval_seconds: 10
  outbound_queue_capacity: 8
  send_timeout_seconds: 5
  heartbeat_stale_seconds: 30
  market_data_stale_seconds: 30
  fallback_poll_seconds: 2
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 30
  staleness_check_seconds: 1
cors_origins: []
prometheus:
  enabled: true
tsdb:
  enabled: true
  url: "http://influxdb:8086"
  token: "mockx-token"
  org: "mockx-org"
  bucket: "mockx"
  batch_size: 1000
