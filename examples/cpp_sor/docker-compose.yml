services:
  venue-a:
    build:
      context: ../..
    image: mockx-cpp-sor:local
    environment:
      CFG_PATH: /opt/mockx/examples/cpp_sor/venue_a_docker.yml
      FIX_CONFIG_FILE: /opt/mockx/examples/cpp_sor/venue_a_acceptor.cfg
    ports:
    - 4101:4101
    - 8101:8101
    - 18101:18101
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8101/readyz
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
    depends_on:
      questdb:
        condition: service_healthy
  venue-b:
    image: mockx-cpp-sor:local
    pull_policy: never
    environment:
      CFG_PATH: /opt/mockx/examples/cpp_sor/venue_b_docker.yml
      FIX_CONFIG_FILE: /opt/mockx/examples/cpp_sor/venue_b_acceptor.cfg
    ports:
    - 4102:4102
    - 8102:8102
    - 18201:18201
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8102/readyz
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
    depends_on:
      questdb:
        condition: service_healthy
  venue-a-mold-relay:
    image: mockx-cpp-sor:local
    pull_policy: never
    environment:
      PYTHONUNBUFFERED: '1'
    entrypoint:
    - python
    - examples/moldudp64_host_relay.py
    command:
    - --multicast-group
    - 239.192.10.1
    - --multicast-port
    - '18100'
    - --target-host
    - host.docker.internal
    - --target-port
    - '18100'
    depends_on:
      venue-a:
        condition: service_healthy
    init: true
    restart: on-failure
  venue-b-mold-relay:
    image: mockx-cpp-sor:local
    pull_policy: never
    environment:
      PYTHONUNBUFFERED: '1'
    entrypoint:
    - python
    - examples/moldudp64_host_relay.py
    command:
    - --multicast-group
    - 239.192.10.2
    - --multicast-port
    - '18200'
    - --target-host
    - host.docker.internal
    - --target-port
    - '18200'
    depends_on:
      venue-b:
        condition: service_healthy
    init: true
    restart: on-failure
  seed-books:
    image: mockx-cpp-sor:local
    pull_policy: never
    environment:
      PYTHONUNBUFFERED: '1'
    entrypoint:
    - python
    - examples/cpp_sor/seed_books.py
    command:
    - --fix-config
    - examples/cpp_sor/seed_books_docker.cfg
    - --venue-a-url
    - http://venue-a:8101
    - --venue-b-url
    - http://venue-b:8102
    depends_on:
      venue-a:
        condition: service_healthy
      venue-b:
        condition: service_healthy
      venue-a-mold-relay:
        condition: service_started
      venue-b-mold-relay:
        condition: service_started
    init: true
  questdb:
    image: questdb/questdb:9.4.3
    environment:
      QDB_HTTP_USER: mockx-user
      QDB_HTTP_PASSWORD: mockx-password
      QDB_PG_USER: mockx-user
      QDB_PG_PASSWORD: mockx-password
      QDB_PG_READONLY_USER_ENABLED: 'true'
      QDB_PG_READONLY_USER: dashboard_reader
      QDB_PG_READONLY_PASSWORD: mockx-dashboard-password
      QDB_LINE_AUTO_CREATE_NEW_TABLES: 'false'
      QDB_LINE_AUTO_CREATE_NEW_COLUMNS: 'false'
    ports:
    - 9000:9000
    - 8812:8812
    - 9003:9003
    volumes:
    - questdb-native-data:/var/lib/questdb
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent --show-error --user "$${QDB_HTTP_USER}:$${QDB_HTTP_PASSWORD}"
        http://localhost:9003
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  dashboard-projector:
    image: mockx-cpp-sor:local
    pull_policy: never
    environment:
      PYTHONUNBUFFERED: '1'
      QUESTDB_URL: http://questdb:9000
      QUESTDB_USERNAME: mockx-user
      QUESTDB_PASSWORD: mockx-password
    entrypoint:
    - python
    - examples/dashboard/projector.py
    depends_on:
      questdb:
        condition: service_healthy
      venue-a:
        condition: service_healthy
      venue-b:
        condition: service_healthy
    init: true
    restart: on-failure
  grafana:
    image: grafana/grafana:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: mockx-dashboard
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 250ms
      GF_PLUGINS_PREINSTALL_SYNC: questdb-questdb-datasource@0.1.8,nline-plotlyjs-panel@1.8.1
      QDB_READER_PASSWORD: mockx-dashboard-password
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
    - 3001:3000
    volumes:
    - ../dashboard/provisioning:/etc/grafana/provisioning:ro
    - ../dashboard/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      questdb:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://localhost:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  questdb-native-data: {}
