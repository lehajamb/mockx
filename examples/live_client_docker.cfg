[DEFAULT]
ConnectionType=initiator
ReconnectInterval=2
TargetCompID=MOCKX_DEMO
SocketConnectHost=mockx
SocketConnectPort=4001
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=/opt/mockx/configs/FIX44.xml
HeartBtInt=30
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y
RefreshOnLogon=Y
# MockX includes TradeID (1003), which is absent from the bundled dictionary.
AllowUnknownMsgFields=Y

ScreenLogShowIncoming=N
ScreenLogShowOutgoing=N
ScreenLogShowEvents=N

[SESSION]
BeginString=FIX.4.4
SenderCompID=liquidity_bot

[SESSION]
BeginString=FIX.4.4
SenderCompID=taker_bot
