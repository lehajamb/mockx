[DEFAULT]
ConnectionType=initiator
ReconnectInterval=2
TargetCompID=MOCKX_DEMO
SocketConnectHost=mockx
SocketConnectPort=4001
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=/opt/mockx/configs/FIX44.xml
FileStorePath=/opt/mockx/store/live-demo-client
FileLogPath=/opt/mockx/logs/live-demo-client
HeartBtInt=30
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y
RefreshOnLogon=Y
# MockX includes TradeID (1003), which is absent from the bundled dictionary.
AllowUnknownMsgFields=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=liquidity_bot

[SESSION]
BeginString=FIX.4.4
SenderCompID=taker_bot
