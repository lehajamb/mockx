exchange_name: MockX-CoinAPI
instruments:
  BTC-USDT:
    tick_size: "0.01"
    lot_size: "0.00000001"
    price_display_precision: 2
    quantity_display_precision: 8
latency:
  inbound_ms: 0
  outbound_ms: 0
  engine_ms: 1
execution:
  reject_prob: 0.0
  random_seed: 42
admin_api:
  host: 127.0.0.1
  port: 8001
  enabled: true
fix:
  enabled: true
  delivery_retry_interval_ms: 1000
  delivery_max_attempts_per_cycle: 3
  delivery_terminal_retention_records: 10000
  session_participants:
    "FIX.4.4:MOCKX_COINAPI->replay_buy": replay-buyer
    "FIX.4.4:MOCKX_COINAPI->replay_sell": replay-seller
    "FIX.4.4:MOCKX_COINAPI->controller": midpoint-controller
    "FIX.4.4:MOCKX_COINAPI->strategy_bot": strategy
scheduler:
  mode: realtime
  rate: 1.0
  interval_ms: 1
  max_events_per_advance: 100000
websocket:
  snapshot_interval_ms: 50
  heartbeat_interval_seconds: 1
  outbound_queue_capacity: 8
  send_timeout_seconds: 5
  heartbeat_stale_seconds: 5
  market_data_stale_seconds: 30
  fallback_poll_seconds: 2
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 30
  staleness_check_seconds: 1
cors_origins: []
prometheus:
  enabled: true
itch:
  enabled: true
  round_lot_size: 1
moldudp64:
  multicast_group: 239.192.0.1
  multicast_port: 18000
  session_prefix: MX
  heartbeat_interval_ms: 1000
  max_payload_bytes: 1400
  interface_address: 0.0.0.0
  ttl: 1
glimpse:
  enabled: true
soupbintcp:
  host: 127.0.0.1
  port: 18001
  session_prefix: GS
  credentials:
    GLIMP: CHANGE_ME
